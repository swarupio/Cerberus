# chaos-tool is a manual CLI outside Compose.
services:
  gateway:
    build: ./gateway
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - app

  user-service:
    build: ./user-service
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - app

  order-service:
    build: ./order-service
    ports:
      - "127.0.0.1:3002:3000"
    networks:
      - app

  prometheus:
    image: prom/prometheus:v3.13.4
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - app

  grafana:
    image: grafana/grafana:13.2.2
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
