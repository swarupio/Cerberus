# chaos-tool is a manual CLI outside Compose.
services:
  gateway:
    build: ./gateway
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - app

  user-service:
    build: ./user-service
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - app

  order-service:
    build: ./order-service
    ports:
      - "127.0.0.1:3002:3000"
    networks:
      - app

  prometheus:
    image: prom/prometheus:v3.13.4
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - app

  # grafana: runtime definition deferred to Phase 3.

networks:
  app:
    driver: bridge

volumes:
  prometheus-data:
