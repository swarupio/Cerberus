global:
  scrape_interval: 5s
  scrape_timeout: 3s

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['gateway:3000']

  - job_name: user-service
    metrics_path: /metrics
    static_configs:
      - targets: ['user-service:3000']

  - job_name: order-service
    metrics_path: /metrics
    static_configs:
      - targets: ['order-service:3000']
